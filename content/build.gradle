repositories {
    maven { name = 'WTHIT'; url = 'https://maven4.bai.lol' }
}

base { archivesName = "${project.archives_base_name}-content" }

loom {
    accessWidenerPath = file('src/main/resources/unbeta-content.accesswidener')
}

dependencies {
    // The `namedElements` configuration is REQUIRED. A plain project(':core')
    // dependency will not be remapped by Loom and will fail at runtime.
    implementation project(path: ':core', configuration: 'namedElements')

    // WTHIT plugin (mimic disguise). Compile-only: players supply WTHIT themselves.
    // Downloaded from WTHIT's official maven, so GitHub's build can get it too.
    modCompileOnly "mcp.mobius.waila:wthit-api:fabric-8.16.0"
}
