name: build

on:
  push:
    branches: [ main, 'phase-*' ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Validate manifest.json is parseable
        run: python3 -c "import json;d=json.load(open('core/src/main/resources/unbeta/manifest.json'));print(len(d['entries']),'entries')"

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: unbeta-jars
          path: |
            core/build/libs/*.jar
            content/build/libs/*.jar
